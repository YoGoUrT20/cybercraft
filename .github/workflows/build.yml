name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mod:
    name: Minecraft mod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: cybercraft-fabric
          path: fabric/build/libs/*.jar

  plugin:
    name: Cyberpunk plugin
    # the CMake preset uses the Visual Studio 17 2022 generator
    runs-on: windows-2022
    defaults:
      run:
        working-directory: red4ext
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: cmake --preset default
      - run: cmake --build --preset release
      - uses: actions/upload-artifact@v4
        with:
          name: CyberCraft-plugin
          path: |
            red4ext/build/RelWithDebInfo/CyberCraft.dll
            red4ext/build/RelWithDebInfo/CyberCraft.pdb
